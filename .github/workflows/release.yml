name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.version.outputs.code }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - id: version
        run: |
          code=$((100 + GITHUB_RUN_NUMBER))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$code" >> "$GITHUB_OUTPUT"

  client:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    env:
      FASTCAST_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fastcast-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=fastcast\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/fastcast-release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          echo "FASTCAST_SIGNING=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: Test, lint and build
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Package
        run: |
          out="$RUNNER_TEMP/client"
          mkdir -p "$out"
          apk="$out/fastcast-tv.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          tag="v${{ needs.version.outputs.name }}"
          printf '{"versionCode":%s,"versionName":"%s","url":"https://github.com/%s/releases/download/%s/fastcast-tv.apk","sha256":"%s","size":%s}\n' \
            "$FASTCAST_VERSION_CODE" "${{ needs.version.outputs.name }}" "$GITHUB_REPOSITORY" "$tag" \
            "$(sha256sum "$apk" | cut -d' ' -f1)" "$(stat -c%s "$apk")" > "$out/fastcast-tv.json"
          cat "$out/fastcast-tv.json"
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: ${{ runner.temp }}/client/*

  server:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Test
        run: cargo nextest run --workspace
      - name: Build
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release -p app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/fastcast.exe, .env.example dist/
          Compress-Archive -Path dist/* -DestinationPath fastcast-server-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: fastcast-server-windows-x64.zip

  release:
    needs: [version, client, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.name }}"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "fastcast $tag" \
            --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}" \
            --latest
