[workspace]
resolver = "3"
members = [
    "apps/server",
    "packages/*"
]
default-members = [
    "apps/server",
    "packages/media"
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
bytes = "1.12"
dotenvy = "0.15.7"
embed-resource = "3.0.12"
futures-util = "0.3.34"
mimalloc = { version = "0.1.52", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

media = { path = "packages/media" }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[profile.test]
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.release.package."*"]
opt-level = 3
