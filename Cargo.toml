[workspace]
resolver = "3"
members = [
    "apps/client/native",
    "apps/server",
    "packages/*"
]
default-members = [
    "apps/server",
    "packages/media"
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
base64 = "0.22"
bytes = "1.12"
cc = "1.10.0"
embed-resource = "3.0.12"
jni-sys = "0.4.1"
libc = "0.2.191"
mimalloc = { version = "0.1.52", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = "0.62.2"

desktop = { path = "packages/desktop" }
fastcast-native = { path = "apps/client/native" }
media = { path = "packages/media" }
nvenc = { path = "packages/nvenc" }
wire = { path = "packages/wire" }

[profile.dev]
opt-level = 3
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[profile.test]
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.release.package."*"]
opt-level = 3

[profile.android]
inherits = "release"
panic = "unwind"
