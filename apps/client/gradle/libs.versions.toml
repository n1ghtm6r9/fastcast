[versions]
agp = "8.7.3"
kotlin = "2.1.0"
okhttp = "4.12.0"
junit = "4.13.2"
json = "20240303"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
